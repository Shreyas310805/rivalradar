services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rivalradar-backend
    ports:
      - "8000:8000"
    environment:
      # Secrets come from a .env file next to this compose file (never committed).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      DATABASE_URL: sqlite:////app/data/rivalradar.db
      DATA_DIR: /app/data
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      RESPECT_ROBOTS_TXT: "true"
      ALLOW_PRIVATE_NETWORKS: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: INFO
    volumes:
      # Snapshots, reports and the SQLite file survive container restarts.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rivalradar-frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side rewrites inside the compose network address the service name.
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

