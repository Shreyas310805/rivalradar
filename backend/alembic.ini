; Alembic configuration for RivalRadar.
;
; The database URL is deliberately NOT set here. alembic/env.py reads it from
; the application settings, which read DATABASE_URL from the environment — so
; migrations always target the same database the app does, and no credentials
; are ever written to a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

; Timestamped, readable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
