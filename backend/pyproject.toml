[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rivalradar"
version = "1.0.0"
description = "AI-powered competitor intelligence agent"
# No `readme` key: the project README lives at the repository root, and
# setuptools refuses to read a file outside the package directory, which
# breaks `pip install -e .`.
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies are pinned in requirements.txt (and requirements.lock.txt
# for an exact reproduction). They are listed here so `pip install -e .` works.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "SQLAlchemy>=2.0.54",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.3",
    "openai>=3.16.2",
    "APScheduler>=3.11.3",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
playwright = ["playwright>=1.49.1"]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.8.0"]

[project.scripts]
rivalradar = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "network: tests that make live network requests (deselect with -m 'not network')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ANN"]
ignore = [
    "ANN401",  # Any is deliberate for lazily-imported SDK types
    "B008",    # FastAPI Depends() in defaults is the documented pattern
    # (str, Enum) is kept over StrEnum: it serialises identically through
    # SQLAlchemy and Pydantic and works on any 3.11 runtime.
    "UP042",
    # OpenRouterRateLimited / OpenRouterUnavailable read better without an
    # "Error" suffix and both subclass LLMError, which carries the convention.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]
# Alembic writes these files; their formatting is Alembic's, not ours, and
# hand-editing them to satisfy the linter invites transcription errors in the
# one place a mistake silently corrupts a production schema.
"alembic/versions/*" = ["E501", "I001", "ANN"]
"alembic/env.py" = ["E402"]
# Demo fixtures are raw HTML strings; wrapping them hurts readability.
"app/database/demo_pages.py" = ["E501"]
